<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cb8ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf2a0"/>
      <stop offset="1" stop-color="#16c86a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a78"/>
      <stop offset="1" stop-color="#f73535"/>
    </linearGradient>
    <!-- a rounded isometric square; the round stroke rounds its corners -->
    <path id="layer" d="M64 0 L106 24 L64 48 L22 24 Z" stroke-width="12" stroke-linejoin="round"/>
  </defs>
  <g transform="translate(0 62)">
    <use href="#layer" transform="translate(0 6)" fill="#0b45e0" stroke="#0b45e0"/>
    <use href="#layer" fill="url(#blue)" stroke="url(#blue)"/>
  </g>
  <g transform="translate(0 40)">
    <use href="#layer" transform="translate(0 6)" fill="#0a9a48" stroke="#0a9a48"/>
    <use href="#layer" fill="url(#green)" stroke="url(#green)"/>
  </g>
  <g transform="translate(0 18)">
    <use href="#layer" transform="translate(0 6)" fill="#d4141c" stroke="#d4141c"/>
    <use href="#layer" fill="url(#red)" stroke="url(#red)"/>
  </g>
</svg>
